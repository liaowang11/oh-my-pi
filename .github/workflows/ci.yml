name: CI

on:
  workflow_dispatch:
    inputs:
      skip_npm:
        type: boolean
        default: true

jobs:
  sync_rust_sdk:
    name: Verify Rust SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust SDK
        run: cargo check --manifest-path sdk/rust/omp-rpc/Cargo.toml --all-targets
      - name: Check Rust SDK formatting
        run: cargo fmt --manifest-path sdk/rust/omp-rpc/Cargo.toml -- --check
      - name: Lint Rust SDK
        run: cargo clippy --manifest-path sdk/rust/omp-rpc/Cargo.toml --all-targets -- -D warnings
